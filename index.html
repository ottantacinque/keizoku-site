<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>【アプリ名】 - 法的文書</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic UI", sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .card {
      background: #fff;
      border-radius: 18px;
      padding: 3rem 2.5rem;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      text-align: center;
    }
    h1 { font-size: 2rem; font-weight: 700; margin-bottom: 0.4rem; }
    .subtitle { color: #6e6e73; font-size: 0.95rem; margin-bottom: 2.5rem; }
    .links { display: flex; flex-direction: column; gap: 1rem; }
    .links a {
      display: block;
      padding: 1rem 1.5rem;
      border-radius: 12px;
      background: #f5f5f7;
      color: #1d1d1f;
      text-decoration: none;
      font-size: 1rem;
      font-weight: 500;
      transition: background 0.15s;
    }
    .links a:hover { background: #e8e8ed; }
    footer { margin-top: 2rem; color: #6e6e73; font-size: 0.8rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>【アプリ名】</h1>
    <p class="subtitle">法的文書・ポリシー</p>
    <nav class="links">
      <a href="terms-of-service.html">利用規約</a>
      <a href="privacy-policy.html">プライバシーポリシー</a>
    </nav>
  </div>
  <footer>© 【事業者名】</footer>
</body>
</html>
